<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深夜鳶尾咖啡 - 台北深夜咖啡廳推薦指南</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-12">
        <a href="index.html" class="inline-block text-amber-400 hover:text-amber-300 mb-8 transition-colors">← 返回深夜地圖</a>
        
        <header class="mb-8">
            <h1 class="text-4xl font-black text-amber-400 mb-2">深夜鳶尾咖啡 Midnight Iris</h1>
            <p class="text-zinc-400 italic">「當整座城市都睡了，這裡的咖啡香才剛開始收汁。」</p>
        </header>
        
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 mb-8">
            <h3 class="text-lg font-bold text-amber-400 mb-4">📋 基礎硬體檔案</h3>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div><span class="text-zinc-400">🕒 營業時間：</span>19:00 - 凌晨 04:00</div>
                <div><span class="text-zinc-400">🔌 插座狀況：</span>每個座位皆有獨立插座</div>
                <div><span class="text-zinc-400">🤫 均勻音量：</span>極安靜，限單人專注工作</div>
                <div><span class="text-zinc-400">☕ 推薦必點：</span>深夜肉桂捲、極黑西西里</div>
            </div>
        </div>
        
        <section class="prose text-zinc-300 space-y-4">
            <p>這是一家專為午夜靈感爆發的文字工作者設計的避難所。店內燈光極其朦朧，只有每張桌上亮著一盞琥珀色的微光。環境音被完美的限制在鍵盤敲擊聲與輕柔的獨立音樂之中。</p>
            <p>主廚特別推薦他們的深夜肉桂捲，外皮大火烤得微微焦香，淋上濃郁的黑糖肉桂醬，完美收汁。搭配一杯偏酸的極黑西西里咖啡，絕對能陪你奮戰到天亮。</p>
        </section>
    </div>
</body>
